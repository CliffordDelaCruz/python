<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        input, button {
            padding: 10px;
            margin: 5px;
        }
        table {
            width: 50%;
            margin: auto;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Attendance Tracker</h1>

    <!-- Form to Save Attendance -->
    <form action="/" method="post">
        <input type="text" name="name" placeholder="Enter Name" required>
        <button type="submit">Save Attendance</button>
    </form>

    <hr>

    <!-- Form to Search Names -->
    <form id="searchForm">
        <input type="text" id="search_name" placeholder="Search Name" required>
        <button type="button" onclick="searchName()">Find Name</button>
    </form>

    <hr>

    <!-- Table for Search Results -->
    <h2>Search Results</h2>
    <table id="resultsTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Attendance Date</th>
            </tr>
        </thead>
        <tbody id="resultsBody">
        </tbody>
    </table>

    <script>
        function searchName() {
            let searchValue = document.getElementById("search_name").value;

            fetch("/search", {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: "search_name=" + encodeURIComponent(searchValue)
            })
            .then(response => response.json())
            .then(data => {
                let tableBody = document.getElementById("resultsBody");
                tableBody.innerHTML = ""; // Clear previous results

                if (data.length === 0) {
                    tableBody.innerHTML = "<tr><td colspan='2'>No matching names found</td></tr>";
                    return;
                }

                data.forEach(entry => {
                    let row = `<tr>
                        <td>${entry.Name}</td>
                        <td>${entry.attendance_date || "Not Recorded"}</td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            })
            .catch(error => console.error("Error fetching search results:", error));
        }
    </script>

</body>
</html>
